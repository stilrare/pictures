.container{
	position: absolute;
	top: 0;
	height: 100%;
	width: 100%;
}

a{
	text-decoration: none;
	color: #fff;
	font-size: 19px;
	font-family: 'Poppins', sans-serif;
}
.active, a:hover{

.content{

	width: 100%;
	bottom: 0;
}
.cover{
	display: flex;	
	flex-wrap: wrap;
	justify-content: center;
	align-items: center;
	position: absolute;
	height: 90%;
	width: 100%;
	margin-top: -15px;
	gap: 5px;

}
.img{

	border-radius: 5px;

	display: flex;
	justify-content: center;
	align-items: center;

}
img{
    transition: transform 0.3s ease;
	width: 370px;
}

img:hover{
    transform: scale(1.8);
    z-index: 1;
}

*{
    margin: 0;
    padding: 0;
}
