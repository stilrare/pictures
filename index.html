<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bilder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
    }

    .container {
      position: absolute;
      top: 0;
      height: 100%;
      width: 100%;
    }

	.container div{
		width: 2000px;
	}

	 @media (hover: hover) and (pointer: fine) {
      .img:hover {
        background-color: var(--card-dark);
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(255,255,255,0.12);
      }
    }
 
    /* responsive rules */
    /* medium screens: show 4 columns */
    @media (max-width: 900px) {
      .container {
        grid-template-columns: repeat(4, 1fr);
        padding: 18px;
      }
    }
 
    /* small screens (phones): show 2 columns */
    @media (max-width: 600px) {
      .container {
        grid-template-columns: repeat(2, 1fr);
        padding: 12px;
      }
      .container div {
        padding: 14px;
        font-size: 16px;
      }
    }
 
    /* very small: single column stack */
    @media (max-width: 380px) {
      .container {
        grid-template-columns: 1fr;
        padding: 10px;
      }
      .container div {
        padding: 12px;
        font-size: 15px;
      }
    }

    a {
      text-decoration: none;
      color: #fff;
      font-size: 19px;
    }

    .active,
    a:hover {
      color: wheat;
    }

    .content {
      position: absolute;
      height: 89vh;
      width: 100%;
      bottom: 0;
    }

    .cover {
      display: grid;
      grid-template-columns: auto auto auto auto;
      justify-content: center;
      align-items: center;
      position: absolute;
      height: 90%;
      width: 100%;
      margin-top: -15px;
      gap: 7px;
      padding: 10px;
    }

    .img {
      position: relative;
      height: 259px;
      width: 100%;
      max-width: 390px;
      border-radius: 5px;
      background: rgb(255, 0, 0);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    img {
      transition: transform 0.3s ease;
      width: 340px;
    }

    img:hover {
      transform: scale(1.8);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="cover">
        <div class="img"><img src="https://media.istockphoto.com/id/517188688/photo/mountain-landscape.jpg"></div>
        <div class="img"><img src="https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg" /></div>
        <div class="img"><img src="https://i0.wp.com/picjumbo.com/wp-content/uploads/beautiful-fall-nature-scenery-free-image.jpeg" /></div>
        <div class="img"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c8/Altja_j%C3%B5gi_Lahemaal.jpg" /></div>
        <div class="img"><img src="https://img.freepik.com/free-photo/landscape-with-lake-sunset_395237-259.jpg" /></div>
        <div class="img"><img src="photo15.jpg" /></div>
        <div class="img"><img src="photo16.jpg" /></div>
        <div class="img"><img src="photo17.jpg" /></div>
        <div class="img"><img src="photo18.jpg" /></div>
        <div class="img"><img src="photo19.jpg" /></div>
        <div class="img"><img src="photo20.jpg" /></div>
        <div class="img"><img src="photo21.jpg" /></div>
        <div class="img"><img src="photo22.jpg" /></div>
        <div class="img"><img src="photo23.jpg" /></div>
        <div class="img"><img src="photo24.jpg" /></div>
        <div class="img"><img src="photo4.jpg" /></div>
        <div class="img"><img src="photo5.jpg" /></div>
        <div class="img"><img src="photo6.jpg" /></div>
        <div class="img"><img src="photo7.jpg" /></div>
        <div class="img"><img src="photo8.jpg" /></div>
        <div class="img"><img src="photo9.jpg" /></div>
        <div class="img"><img src="photo10.jpg" /></div>
        <div class="img"><img src="photo11.jpg" /></div>
        <div class="img"><img src="photo12.jpg" /></div>
      </div>
    </div>
  </div>
</body>
</html>
