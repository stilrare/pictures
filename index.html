  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #4853e6;
    }

    .container {
      width: 100%;
      padding: 20px;
    }

    .content {
      max-width: 1400px;
      margin: 0 auto;
    }

    .cover {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      justify-content: center;
      align-items: center;
    }

    .img {
      background: rgb(255, 0, 0);
      border-radius: 5px;
      height: 259px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img {
      width: 340px;
      max-width: 100%;
      transition: transform 0.3s ease;
    }

    img:hover {
      transform: scale(1.8);
      z-index: 1;
    }

    @media (max-width: 600px) {
      .cover {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
