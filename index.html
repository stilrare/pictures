<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bilder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
    }

    .container {
      top: 0;
      height: 100%;
      width: 100%;
    }

    a {
      text-decoration: none;
      color: #fff;
      font-size: 19px;
    }

    .active,
    a:hover {
      color: wheat;
    }

    .content {
      position: absolute;
      height: 89vh;
      width: 100%;
      bottom: 0;
    }

    .cover {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* Default: 4 columns */
      justify-content: center;
      align-items: center;
      position: absolute;
      height: 90%;
      width: 100%;
      margin-top: -15px;
      gap: 7px;
      padding: 10px;
    }

    .img {
      position: relative;
      height: 259px;
      width: 100%;
      max-width: 390px;
      border-radius: 5px;
      background: rgb(255, 0, 0);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    img {
      transition: transform 0.3s ease;
      width: 340px;
      max-width: 100%;
    }

    img:hover {
      transform: scale(1.8);
      z-index: 1;
    }

    /* 📱 Portrait / Small Screen: One image per row */
    @media (max-width: 600px) {
      .cover {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="cover">
        <div class="img"><img src="https://img.freepik.com/free-photo/landscape-with-lake-sunset_395237-259.jpg"></div>
        <div class="img"><img src="https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg" /></div>
        <div class="img"><img src="https://i0.wp.com/picjumbo.com/wp-content/uploads/beautiful-fall-nature-scenery-free-image.jpeg" /></div>
        <div class="img"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c8/Altja_j%C3%B5gi_Lahemaal.jpg" /></div>
      </div>
    </div>
  </div>
</body>
</html>
